[project]
name = "finmlops-data-pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=2.2,<3",
    "pyarrow>=17,<26",
    "python-dotenv>=1.2.4",
    "tensorflow-data-validation>=1.21.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --no-header"
filterwarnings = [
    # google-api-core nags about Python 3.11 end of life; we pin 3.11 for TFDV
    "ignore:You are using a Python version:FutureWarning",
]
