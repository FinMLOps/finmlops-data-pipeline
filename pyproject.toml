[project]
name = "finmlops-data-pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dvc[gs]>=3.67.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --no-header"
